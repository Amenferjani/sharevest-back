apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-deployment
  labels:
    app: portfolio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio
  template:
    metadata:
      labels:
        app: portfolio
    spec:
      restartPolicy: Always
      containers:
        - name: portfolio
          image: amenferjani/portfolio:latest
          ports:
            - containerPort: 3002
          envFrom:
            - configMapRef:
                name: global-config
            - secretRef:
                name: global-secret
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            tcpSocket:
              port: 3002
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 3002
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3

      securityContext:
        runAsUser: 1000
        fsGroup: 2000
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-service
spec:
  selector:
    app: portfolio
  ports:
    - protocol: TCP
      port: 3002  
      targetPort: 3002
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: portfolio-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: portfolio-deployment
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 60
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-postgres-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-postgres
  template:
    metadata:
      labels:
        app: portfolio-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: global-secret
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: portfolio-postgres-storage
      volumes:
        - name: portfolio-postgres-storage
          persistentVolumeClaim:
            claimName: portfolio-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-postgres-service
spec:
  selector:
    app: portfolio-postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: portfolio-postgres-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual-hostpath
  hostPath:
    path: /run/desktop/mnt/host/c/Users/AMEN/Desktop/k8s-data/portfolio-postgres
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: portfolio-postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests: 
      storage: 5Gi
  storageClassName: manual-hostpath
  volumeName: portfolio-postgres-pv
