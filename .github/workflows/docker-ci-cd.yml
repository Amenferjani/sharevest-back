name: CI/CD - Build & Push Docker Images

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      service:
        description: 'Service to build (leave blank to build all)'
        required: false
        default: ''

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [
          gateway,
          hedge-vest,
          part-vest,
          payment-vest,
          portfolio,
          private-vest,
          rel-vest,
          risk-vest,
          user
        ]
      fail-fast: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image for ${{ matrix.service }}
      if: ${{ github.event_name == 'push' || github.event.inputs.service == '' || matrix.service == github.event.inputs.service }}
      uses: docker/build-push-action@v5
      with:
        context: ./${{ matrix.service }}
        file: ./${{ matrix.service }}/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:latest
